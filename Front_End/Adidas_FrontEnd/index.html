<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      // Pick the theme before the first paint so the page never flashes the wrong colours.
      // Saved choice wins; otherwise follow the device's light/dark setting.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f8f7f4");
        }
      })();
    </script>
    <meta
      name="description"
      content="MLocal — performance sportswear and footwear for every move."
    />
    <title>MLocal — Performance sportswear</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
